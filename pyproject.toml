[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sluice"
version = "0.0.1"
description = "Multi-agent equity research pipeline with per-item news scoring, learned weights and guarded self-improvement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "exchange_calendars>=4.5",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2",
    "python-dotenv>=1",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13",
    "yfinance>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sluice = "sluice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sluice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs network or API keys; skipped by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
